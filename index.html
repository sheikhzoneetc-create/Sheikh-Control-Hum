<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sheikh Control Hub</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Mobile Console Debugger -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>

  <!-- Icons & Styling -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  
  <style>
    /* Clean Modal Styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 99999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      width: 88%;
      max-width: 380px;
      border: 1px solid #334155;
      color: #f8fafc;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .modal-content input {
      width: 100%;
      padding: 11px;
      margin: 6px 0;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
    }
    .modal-content input:focus {
      border-color: #38bdf8;
    }
  </style>
</head>
<body>

  <!-- Search Bar -->
  <div style="padding: 12px 16px;">
    <div style="position: relative;">
      <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 14px; top: 12px; color: #64748b;"></i>
      <input type="text" id="globalSearch" placeholder="নাম বা নাম্বার খুঁজুন..." 
             style="width: 100%; padding: 10px 10px 10px 38px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; box-sizing: border-box; outline: none;">
    </div>
  </div>

  <!-- Main Content Area -->
  <div style="padding: 0 16px 90px 16px;">
    
    <!-- Tab 1: Packages -->
    <div id="tab-packages" class="tab-content">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px;">
        <div class="card" style="margin: 0;">
          <div style="font-size: 11px; color: #94a3b8;">সক্রিয় কাস্টমার</div>
          <div id="count-active-pkg" style="font-size: 18px; font-weight: bold; color: #38bdf8; margin-top: 4px;">০ জন</div>
        </div>
        <div class="card" style="margin: 0;">
          <div style="font-size: 11px; color: #94a3b8;">ফাঁকা ফ্যামিলি স্লট</div>
          <div id="count-slots" style="font-size: 18px; font-weight: bold; color: #4ade80; margin-top: 4px;">০ টি</div>
        </div>
      </div>

      <div style="display: flex; gap: 10px; margin-bottom: 14px;">
        <button id="btnOpenModal" class="btn btn-primary" style="flex: 1;">
          <i class="fa-solid fa-user-plus"></i> কাস্টমার যোগ করুন
        </button>
      </div>

      <div id="packageList"></div>
    </div>

    <!-- Tab 2: Gmail -->
    <div id="tab-gmail" class="tab-content" style="display: none;">
      <div style="text-align: center; color: #94a3b8; padding: 40px 0;">
        <i class="fa-solid fa-envelope" style="font-size: 32px; margin-bottom: 10px; color: #38bdf8;"></i>
        <p>জিমেইল সেকশন সক্রিয় আছে</p>
      </div>
    </div>

    <!-- Tab 3: Vault -->
    <div id="tab-vault" class="tab-content" style="display: none;">
      <div style="text-align: center; color: #94a3b8; padding: 40px 0;">
        <i class="fa-solid fa-vault" style="font-size: 32px; margin-bottom: 10px; color: #f59e0b;"></i>
        <p>ভল্ট সেকশন প্রস্তুত</p>
      </div>
    </div>

    <!-- Tab 4: Video -->
    <div id="tab-video" class="tab-content" style="display: none;">
      <div style="text-align: center; color: #94a3b8; padding: 40px 0;">
        <i class="fa-solid fa-play" style="font-size: 32px; margin-bottom: 10px; color: #ec4899;"></i>
        <p>ভিডিও সেকশন প্রস্তুত</p>
      </div>
    </div>

  </div>

  <!-- Bottom Navigation -->
  <div class="bottom-nav">
    <div class="nav-item active" data-tab="packages">
      <i class="fa-solid fa-box-archive"></i>
      <span>প্যাকেজ</span>
    </div>
    <div class="nav-item" data-tab="gmail">
      <i class="fa-solid fa-envelope"></i>
      <span>জিমেইল</span>
    </div>
    <div class="nav-item" data-tab="vault">
      <i class="fa-solid fa-vault"></i>
      <span>ভল্ট</span>
    </div>
    <div class="nav-item" data-tab="video">
      <i class="fa-solid fa-video"></i>
      <span>ভিডিও</span>
    </div>
  </div>

  <!-- Customer Entry Modal Popup -->
  <div id="customerModal" class="modal">
    <div class="modal-content">
      <h3 style="margin-top:0; font-size: 17px; margin-bottom: 12px; color: #38bdf8;">নতুন কাস্টমার যোগ করুন</h3>
      <input type="text" id="custName" placeholder="কাস্টমারের নাম">
      <input type="text" id="custPhone" placeholder="ফোন নাম্বার">
      <input type="number" id="custDays" placeholder="মেয়াদ কত দিন? (যেমন: 15 বা 30)" value="30">
      <input type="text" id="custGB" placeholder="ডাটা / জিবি (যেমন: 20)">
      <input type="text" id="custMin" placeholder="মিনিট (যেমন: 500)">
      <input type="text" id="custPackName" placeholder="প্যাকেজের নাম (যেমন: প্যাক #১)">
      <input type="text" id="custYtMail" placeholder="YouTube প্রিমিয়াম জিমেইল (ঐচ্ছিক)">
      
      <div style="display: flex; gap: 10px; margin-top: 14px;">
        <button id="btnSubmitCust" class="btn btn-success" style="flex: 1;">সেভ করুন</button>
        <button id="btnCloseModal" class="btn btn-danger" style="flex: 1;">বাতিল</button>
      </div>
    </div>
  </div>

  <!-- Firebase Logic Without Any Dependency Errors -->
  <script type="module">
    import { db, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "./firebase-config.js";

    // Telegram App Setup
    if (window.Telegram?.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    let allPackages = [];

    // Tabs Control
    document.querySelectorAll('.bottom-nav .nav-item').forEach(item => {
      item.addEventListener('click', () => {
        const targetTab = item.getAttribute('data-tab');
        document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
        document.querySelectorAll('.bottom-nav .nav-item').forEach(el => el.classList.remove('active'));

        const tabEl = document.getElementById(`tab-${targetTab}`);
        if (tabEl) tabEl.style.display = 'block';
        item.classList.add('active');
      });
    });

    // Calculate Days
    function getRemainingDays(expiryDateStr) {
      if (!expiryDateStr) return 0;
      const target = new Date(expiryDateStr);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      return Math.ceil((target - today) / (1000 * 60 * 60 * 24));
    }

    // Render Cards
    function renderPackages(list) {
      const container = document.getElementById('packageList');
      if (!container) return;
      
      const countEl = document.getElementById('count-active-pkg');
      if (countEl) countEl.innerText = `${list.length} জন`;
      
      container.innerHTML = list.map(item => {
        const daysLeft = getRemainingDays(item.expiryDate);
        const badgeClass = daysLeft <= 3 ? 'badge-expired' : 'badge-active';
        
        return `
          <div class="card">
            <div class="card-title">
              <span>${item.name || 'Unknown'} (${item.phone || 'N/A'})</span>
              <span class="badge ${badgeClass}">${daysLeft} দিন বাকি</span>
            </div>
            <div style="font-size: 13px; color: #94a3b8; margin: 6px 0; line-height: 1.5;">
              📦 <b>প্যাকেজ:</b> ${item.assignedPacks?.[0]?.packName || 'কাস্টম'} | 🌐 <b>ডাটা:</b> ${item.assignedPacks?.[0]?.gb || '০'} GB | 📞 <b>মিনিট:</b> ${item.assignedPacks?.[0]?.min || '০'} Min<br>
              📅 <b>মেয়াদ:</b> ${item.joinDate || 'N/A'} থেকে ${item.expiryDate || 'N/A'} (🔄 রিনিউ: ${item.renewCount || 0} বার)
              ${item.youtubeGmail ? `<br>🔴 <b>YouTube:</b> ${item.youtubeGmail}` : ''}
            </div>
            <div style="display: flex; gap: 8px; margin-top: 10px;">
              <button class="btn btn-sm btn-success" data-action="renew" data-id="${item.id}" data-count="${item.renewCount || 0}">
                <i class="fa-solid fa-arrows-rotate"></i> রিনিউ (+৩০ দিন)
              </button>
              <button class="btn btn-sm btn-danger" data-action="delete" data-id="${item.id}">
                <i class="fa-solid fa-trash"></i> ডিলিট
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // Card Buttons Handler (Renew / Delete)
    document.getElementById('packageList')?.addEventListener('click', async (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      const action = btn.getAttribute('data-action');
      const id = btn.getAttribute('data-id');

      if (action === 'renew') {
        const currentCount = Number(btn.getAttribute('data-count') || 0);
        const expDateObj = new Date();
        expDateObj.setDate(expDateObj.getDate() + 30);
        await updateDoc(doc(db, "packages", id), {
          expiryDate: expDateObj.toISOString().split("T")[0],
          renewCount: currentCount + 1
        });
      } else if (action === 'delete') {
        await deleteDoc(doc(db, "packages", id));
      }
    });

    // Open/Close Modal
    const modal = document.getElementById('customerModal');
    document.getElementById('btnOpenModal').addEventListener('click', () => { modal.style.display = 'flex'; });
    document.getElementById('btnCloseModal').addEventListener('click', () => { modal.style.display = 'none'; });

    // Save Customer Form
    document.getElementById('btnSubmitCust').addEventListener('click', async () => {
      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const durationDays = Number(document.getElementById('custDays').value) || 30;
      const gb = document.getElementById('custGB').value.trim() || "0";
      const min = document.getElementById('custMin').value.trim() || "0";
      const packName = document.getElementById('custPackName').value.trim() || "প্যাকেজ";
      const youtubeGmail = document.getElementById('custYtMail').value.trim();

      if (!name || !phone) {
        alert("নাম ও ফোন নাম্বার লিখুন!");
        return;
      }

      const joinDate = new Date().toISOString().split("T")[0];
      const expDateObj = new Date();
      expDateObj.setDate(expDateObj.getDate() + durationDays);
      const expiryDate = expDateObj.toISOString().split("T")[0];

      await addDoc(collection(db, "packages"), {
        name,
        phone,
        durationDays,
        assignedPacks: [{ packName, gb, min }],
        hasYoutube: !!youtubeGmail,
        youtubeGmail,
        joinDate,
        expiryDate,
        renewCount: 0,
        createdAt: Date.now()
      });

      // Clear & Close
      document.getElementById('custName').value = '';
      document.getElementById('custPhone').value = '';
      document.getElementById('custGB').value = '';
      document.getElementById('custMin').value = '';
      document.getElementById('custPackName').value = '';
      document.getElementById('custYtMail').value = '';
      modal.style.display = 'none';
    });

    // Search Box Logic
    document.getElementById('globalSearch')?.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      renderPackages(allPackages.filter(p => (p.name && p.name.toLowerCase().includes(q)) || (p.phone && p.phone.includes(q))));
    });

    // Realtime Database Listener (Pure collection listener without orderBy error)
    onSnapshot(collection(db, "packages"), (snapshot) => {
      const list = [];
      snapshot.forEach(docSnap => list.push({ id: docSnap.id, ...docSnap.data() }));
      list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      allPackages = list;
      renderPackages(list);
    });
  </script>
</body>
</html>
