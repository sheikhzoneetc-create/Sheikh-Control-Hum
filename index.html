<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sheikh Control Hub</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.7);
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: var(--card-bg, #1a2234);
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      border: 1px solid var(--border-color, #2a374f);
      color: #fff;
    }
    .modal-content input, .modal-content select {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <!-- Search Bar -->
  <div style="padding: 12px 16px;">
    <div style="position: relative;">
      <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 14px; top: 12px; color: #64748b;"></i>
      <input type="text" id="globalSearch" placeholder="নাম, নাম্বার, জিমেইল বা ফাইল খুঁজুন..." 
             style="width: 100%; padding: 10px 10px 10px 38px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; box-sizing: border-box;">
    </div>
  </div>

  <!-- Main Container -->
  <div style="padding: 0 16px 80px 16px;">
    
    <!-- Tab 1: Packages -->
    <div id="tab-packages" class="tab-content">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px;">
        <div class="card" style="margin: 0;">
          <div style="font-size: 11px; color: #94a3b8;">সক্রিয় কাস্টমার</div>
          <div id="count-active-pkg" style="font-size: 18px; font-weight: bold; color: #38bdf8; margin-top: 4px;">০ জন</div>
        </div>
        <div class="card" style="margin: 0;">
          <div style="font-size: 11px; color: #94a3b8;">ফাঁকা ফ্যামিলি স্লট</div>
          <div id="count-slots" style="font-size: 18px; font-weight: bold; color: #4ade80; margin-top: 4px;">০ টি</div>
        </div>
      </div>

      <div style="display: flex; gap: 10px; margin-bottom: 14px;">
        <button class="btn btn-primary" onclick="openCustomerModal()" style="flex: 1;">
          <i class="fa-solid fa-user-plus"></i> কাস্টমার যোগ করুন
        </button>
      </div>

      <div id="packageList"></div>
    </div>

    <!-- Tab 2: Gmail -->
    <div id="tab-gmail" class="tab-content" style="display: none;">
      <div style="display: flex; gap: 10px; margin-bottom: 14px;">
        <button class="btn btn-primary" onclick="openGmailModal()" style="flex: 1;">
          <i class="fa-solid fa-plus"></i> জিমেইল যোগ করুন
        </button>
      </div>
      <div id="gmailList"></div>
    </div>

    <!-- Tab 3: Vault -->
    <div id="tab-vault" class="tab-content" style="display: none;">
      <div style="display: flex; gap: 10px; margin-bottom: 14px;">
        <button class="btn btn-primary" onclick="openVaultModal()" style="flex: 1;">
          <i class="fa-solid fa-shield"></i> ডাটা সেভ করুন
        </button>
      </div>
      <div id="vaultList"></div>
    </div>

    <!-- Tab 4: Video -->
    <div id="tab-video" class="tab-content" style="display: none;">
      <div id="videoCategoryList"></div>
    </div>

  </div>

  <!-- Bottom Navigation -->
  <div class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('packages', this)">
      <i class="fa-solid fa-box-archive"></i>
      <span>প্যাকেজ</span>
    </div>
    <div class="nav-item" onclick="switchTab('gmail', this)">
      <i class="fa-solid fa-envelope"></i>
      <span>জিমেইল</span>
    </div>
    <div class="nav-item" onclick="switchTab('vault', this)">
      <i class="fa-solid fa-vault"></i>
      <span>ভল্ট</span>
    </div>
  </div>

  <!-- Custom Customer Modal -->
  <div id="customerModal" class="modal">
    <div class="modal-content">
      <h3 style="margin-top:0;">কাস্টমার যোগ করুন</h3>
      <input type="text" id="custName" placeholder="কাস্টমারের নাম">
      <input type="text" id="custPhone" placeholder="ফোন নাম্বার">
      <input type="number" id="custDays" placeholder="মেয়াদ কত দিন (যেমন: 15 বা 30)" value="30">
      <input type="text" id="custGB" placeholder="জিবি (যেমন: 20)">
      <input type="text" id="custMin" placeholder="মিনিট (যেমন: 500)">
      <input type="text" id="custPackName" placeholder="প্যাকেজের নাম">
      <input type="text" id="custYtMail" placeholder="YouTube মেইল (থাকলে)">
      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <button class="btn btn-success" style="flex: 1;" onclick="submitCustomerForm()">সেভ করুন</button>
        <button class="btn btn-danger" style="flex: 1;" onclick="closeModal('customerModal')">বাতিল</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
