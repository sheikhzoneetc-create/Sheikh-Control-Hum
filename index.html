<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sheikh Control Hub</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <!-- টপ হেডার -->
  <header class="top-bar">
    <h2>Sheikh Control Hub</h2>
  </header>

  <!-- মূল কন্টেন্ট স্ক্রিনসমূহ -->
  <main id="app-container" class="main-content">
    
    <!-- ১. প্যাকেজ ট্যাব -->
    <section id="packages-sec" class="tab-sec active">
      <div id="packages-root"></div>
    </section>

    <!-- ২. জিমেইল ট্যাব -->
    <section id="gmail-sec" class="tab-sec">
      <div id="gmail-root"></div>
    </section>

    <!-- ৩. ভল্ট ট্যাব -->
    <section id="vault-sec" class="tab-sec">
      <div id="vault-root"></div>
    </section>

    <!-- ৪. রিমাইন্ডার ট্যাব -->
    <section id="reminder-sec" class="tab-sec">
      <div id="reminder-root"></div>
    </section>

  </main>

  <!-- ফ্লোটিং অ্যাকশন বাটন (সেটিংস/রিফ্রেশ) -->
  <button class="floating-btn" onclick="location.reload()" title="রিফ্রেশ">⚙️</button>

  <!-- সর্বজনীন পপআপ মোডাল -->
  <div id="modal-backdrop" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modal-title">যোগ করুন</h3>
        <button class="close-btn" onclick="window.closeAnyModal()">✕</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- বটম মেনুবার -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="window.switchMainTab('packages-sec', this)">
      <span class="icon">📦</span>
      <span class="label">প্যাকেজ</span>
    </button>
    <button class="nav-item" onclick="window.switchMainTab('gmail-sec', this)">
      <span class="icon">✉️</span>
      <span class="label">জিমেইল</span>
    </button>
    <button class="nav-item" onclick="window.switchMainTab('vault-sec', this)">
      <span class="icon">🗄️</span>
      <span class="label">ভল্ট</span>
    </button>
    <button class="nav-item" onclick="window.switchMainTab('reminder-sec', this)">
      <span class="icon">⏰</span>
      <span class="label">রিমাইন্ডার</span>
    </button>
  </nav>

  <script type="module" src="app.js"></script>
</body>
</html>
